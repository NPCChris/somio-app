<!DOCTYPE html>
<html lang="en" data-skin="native">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Somio">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F2F2F7">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-180.png">
    <title>Somio</title>
    <style>
        /* ============================================================
           TOKENS
           iOS-style look, light + dark follow the phone setting.
           ============================================================ */
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
        }

        /* ---------- Native: light ---------- */
        :root[data-skin="native"] {
            --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            --font-note: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
            --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;

            --bg: #F2F2F7;
            --surface: #FFFFFF;
            --surface-2: #F2F2F7;
            --surface-3: #E5E5EA;
            --ink: #000000;
            --ink-2: rgba(60, 60, 67, 0.62);
            --ink-3: rgba(60, 60, 67, 0.32);
            --line: rgba(60, 60, 67, 0.14);
            --rule: transparent;
            --margin-rule: transparent;

            --accent: #007AFF;
            --accent-soft: rgba(0, 122, 255, 0.12);
            --on-accent: #FFFFFF;
            --danger: #FF3B30;
            --archive: #5856D6;
            --scrim: rgba(0, 0, 0, 0.30);
            --bar: rgba(242, 242, 247, 0.82);

            --r-card: 14px;
            --r-ctrl: 12px;
            --r-sheet: 16px;
            --shadow-card: none;
            --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.20);

            --note-size: 16px;
            --note-lh: 1.38;
            --title-size: 28px;
        }

        @media (prefers-color-scheme: dark) {

            :root[data-skin="native"] {
                --bg: #000000;
                --surface: #1C1C1E;
                --surface-2: #2C2C2E;
                --surface-3: #3A3A3C;
                --ink: #FFFFFF;
                --ink-2: rgba(235, 235, 245, 0.6);
                --ink-3: rgba(235, 235, 245, 0.3);
                --line: rgba(84, 84, 88, 0.5);

                --accent: #0A84FF;
                --accent-soft: rgba(10, 132, 255, 0.18);
                --on-accent: #FFFFFF;
                --danger: #FF453A;
                --archive: #5E5CE6;
                --scrim: rgba(0, 0, 0, 0.5);
                --bar: rgba(0, 0, 0, 0.78);
                --shadow-pop: 0 12px 36px rgba(0, 0, 0, 0.6);
            }
        }

        /* ============================================================
           BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            height: 100%;
            background: var(--bg);
        }

        body {
            font-family: var(--font-ui);
            font-size: 15px;
            color: var(--ink);
            background: var(--bg);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: pan-y;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            cursor: pointer;
        }

        input, textarea {
            font: inherit;
            color: var(--ink);
            -webkit-user-select: text;
            user-select: text;
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        textarea:focus-visible, input:focus-visible {
            outline: none;
        }

        svg.icon {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Shared round icon button */
        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
            position: relative;
            transition: transform 0.15s var(--ease-out), background 0.15s;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: var(--accent-soft);
        }

        .text-btn {
            color: var(--accent);
            font-weight: 600;
            font-size: 16px;
            padding: 8px 4px;
            flex: none;
        }

        /* ============================================================
           CAPTURE SCREEN
           ============================================================ */
        #capture-screen {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: var(--vvh, 100dvh);
            background: var(--surface);
        }

        .capture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: calc(var(--safe-top) + 6px) 12px 6px;
            min-height: 56px;
            background: var(--surface);
        }

        .capture-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .header-circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            position: relative;
            flex-shrink: 0;
            transition: transform 0.15s var(--ease-out), background 0.15s;
        }

        .header-circle-btn:active {
            transform: scale(0.9);
            background: var(--accent-soft);
        }

        .inbox-dot {
            position: absolute;
            top: 4px;
            right: 2px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 9px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 11px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
            font-family: var(--font-ui);
            font-variant-numeric: tabular-nums;
            box-shadow: 0 0 0 2px var(--surface);
        }

        .inbox-dot:empty {
            display: none;
        }

        .fab-small {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--on-accent);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s var(--ease-out), opacity 0.15s;
        }

        .fab-small:active {
            transform: scale(0.9);
        }

        .fab-small svg.icon {
            stroke-width: 2.4;
        }

        .header-spacer {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        /* Big, thumb-height save button that rides just above the keyboard */
        .save-bar {
            flex-shrink: 0;
            padding: 8px 16px calc(var(--safe-bottom) + 12px);
            background: var(--surface);
        }

        body.keyboard-open .save-bar {
            padding-bottom: 8px;
        }

        .save-note-btn {
            width: 100%;
            height: 56px;
            border-radius: 16px;
            background: var(--accent);
            color: var(--on-accent);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 30%, transparent);
            transition: transform 0.12s var(--ease-out), opacity 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .save-note-btn svg.icon {
            width: 22px;
            height: 22px;
            stroke-width: 2.6;
        }

        .save-note-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .save-note-btn:disabled {
            opacity: 0.35;
            box-shadow: none;
            cursor: default;
        }

        .save-note-btn .icon-check,
        .save-note-btn.saved .icon-plus {
            display: none;
        }

        .save-note-btn.saved .icon-check {
            display: block;
        }

        .save-note-btn.saved {
            background: #34C759;
            box-shadow: 0 6px 16px rgba(52, 199, 89, 0.3);
            opacity: 1;
        }

        .capture-date {
            padding: 4px 24px 0;
            font-size: 13px;
            color: var(--ink-3);
            font-variant-numeric: tabular-nums;
        }

        #note-input {
            flex: 1;
            width: 100%;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            padding: 12px 24px 24px;
            font-family: var(--font-note);
            font-size: 19px;
            line-height: 1.45;
            color: var(--ink);
            caret-color: var(--accent);
        }

        #note-input::placeholder {
            color: var(--ink-3);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(var(--safe-bottom) + 96px);
            transform: translate(-50%, 12px);
            background: var(--ink);
            color: var(--surface);
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            white-space: nowrap;
            box-shadow: var(--shadow-pop);
            transition: opacity 0.25s var(--ease-out), transform 0.25s var(--ease-out);
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* ============================================================
           LIST SCREEN
           ============================================================ */
        #archive-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: var(--bg);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: calc(var(--safe-top) + 8px) 12px 8px 16px;
            background: var(--bar);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            position: relative;
            z-index: 20;
        }

        .header h2 {
            font-family: var(--font-display);
            font-size: var(--title-size);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            white-space: nowrap;
        }

        .close-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
            transition: background 0.15s, transform 0.15s var(--ease-out);
        }

        .close-btn:active {
            background: var(--accent-soft);
            transform: scale(0.9);
        }

        .search-bar {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        .search-bar svg.icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--ink-3);
            pointer-events: none;
        }

        .search-bar input {
            width: 100%;
            height: 38px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: var(--surface-3);
            padding: 0 36px 0 32px;
            font-size: 16px;
            color: var(--ink);
        }

        [data-skin="native"] .search-bar input {
            background: rgba(118, 118, 128, 0.12);
        }

        .search-bar input::placeholder {
            color: var(--ink-3);
        }

        .search-clear-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            color: var(--ink-2);
        }

        .search-clear-btn svg.icon {
            position: static;
            transform: none;
            width: 16px;
            height: 16px;
            color: var(--ink-2);
        }

        /* ---------- Overflow menu ---------- */
        .menu-anchor {
            position: relative;
        }

        #export-menu {
            position: absolute;
            right: 0;
            top: 48px;
            min-width: 240px;
            background: var(--surface);
            border-radius: var(--r-ctrl);
            box-shadow: var(--shadow-pop), 0 0 0 0.5px var(--line);
            overflow: hidden;
            z-index: 1000;
            transform-origin: top right;
            animation: menuIn 0.18s var(--ease-out);
        }

        @keyframes menuIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            padding: 13px 16px;
            text-align: left;
            font-size: 16px;
            color: var(--ink);
            border-bottom: 0.5px solid var(--line);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:active {
            background: var(--surface-2);
        }

        .menu-item svg.icon {
            width: 19px;
            height: 19px;
            color: var(--ink-2);
        }

        /* ---------- Tabs ---------- */
        .filter-tabs {
            display: flex;
            gap: 8px;
            padding: 4px 16px 10px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-padding: 0 16px;
            background: var(--bar);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            backdrop-filter: saturate(180%) blur(20px);
            max-height: 64px;
            opacity: 1;
            transition: max-height 0.28s var(--ease-out), opacity 0.2s, padding 0.28s var(--ease-out);
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }

        .filter-tabs::-webkit-scrollbar {
            display: none;
        }

        .filter-tabs.hidden {
            max-height: 0;
            opacity: 0;
            padding-top: 0;
            padding-bottom: 0;
        }

        .filter-tab {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            color: var(--ink);
            background: rgba(118, 118, 128, 0.12);
            transition: background 0.2s, color 0.2s;
        }

        .filter-tab.active {
            background: var(--ink);
            color: var(--surface);
        }

        .tab-count {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-2);
            font-variant-numeric: tabular-nums;
        }

        .filter-tab.active .tab-count {
            color: inherit;
            opacity: 0.7;
        }

        /* ---------- Notes list ---------- */
        .notes-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 12px calc(var(--safe-bottom) + 104px);
        }

        .swipeable-note-container {
            position: relative;
            overflow: hidden;
            margin-bottom: 10px;
            border-radius: var(--r-card);
        }

        .swipeable-note-container.is-suggested {
            opacity: 0.72;
        }

        .swipe-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .archive-action {
            background: var(--archive);
        }

        .delete-action {
            background: var(--danger);
        }

        .note-card {
            position: relative;
            background: var(--surface);
            border-radius: var(--r-card);
            padding: 14px 16px 12px;
            cursor: pointer;
            touch-action: pan-y;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s var(--ease-out), background 0.15s;
        }

        .note-card:active {
            background: var(--surface-2);
        }

        .note-preview {
            font-family: var(--font-note);
            font-size: var(--note-size);
            line-height: var(--note-lh);
            color: var(--ink);
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            white-space: pre-line;
            word-break: break-word;
            margin-bottom: 10px;
        }

        .note-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 13px;
            color: var(--ink-3);
        }

        .note-when {
            flex: none;
            font-variant-numeric: tabular-nums;
        }

        .note-tags {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            min-width: 0;
        }

        .note-tags:empty {
            display: none;
        }

        .tag {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 999px;
        }

        .para-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 999px;
            color: color-mix(in srgb, var(--cat, var(--ink-2)) 70%, var(--ink));
            background: color-mix(in srgb, var(--cat, var(--ink-3)) 16%, transparent);
            white-space: nowrap;
        }

        .para-badge.archived-badge {
            --cat: var(--ink-3);
        }

        .list-label {
            padding: 14px 4px 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-2);
        }

        /* ---------- Empty state ---------- */
        .empty-state {
            text-align: center;
            padding: 72px 32px;
            color: var(--ink-2);
            font-size: 16px;
        }

        .empty-state-icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        /* ---------- Floating action button ---------- */
        .fab {
            position: fixed;
            right: 20px;
            bottom: calc(var(--safe-bottom) + 24px);
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: var(--accent);
            color: var(--on-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 900;
            box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent), 0 2px 4px rgba(0, 0, 0, 0.12);
            transition: transform 0.18s var(--ease-out);
        }

        .fab:active {
            transform: scale(0.92);
        }

        .fab svg.icon {
            width: 26px;
            height: 26px;
            stroke-width: 2.4;
        }

        .fab.hidden {
            display: none;
        }

        /* ============================================================
           SHEETS (edit note, tag picker, categories, word cloud)
           ============================================================ */
        #edit-modal,
        .sheet-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--scrim);
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        #tag-picker-modal { z-index: 2000; }
        #category-manager-modal,
        #word-cloud-modal { z-index: 3000; }

        .modal-content,
        .sheet {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            margin: 0 auto;
            width: 100%;
            max-width: 600px;
            max-height: calc(100dvh - var(--safe-top) - 24px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--surface);
            border-radius: var(--r-sheet) var(--r-sheet) 0 0;
            padding: 0 20px calc(var(--safe-bottom) + 20px);
            box-shadow: var(--shadow-pop);
            animation: sheetUp 0.32s var(--ease-out);
        }

        .modal-content {
            min-height: 62dvh;
        }

        @keyframes sheetUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .sheet-grabber {
            width: 36px;
            height: 5px;
            border-radius: 3px;
            background: var(--surface-3);
            margin: 8px auto 4px;
        }

        .modal-header,
        .sheet-header {
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 6px 0 12px;
            margin: 0 -20px;
            padding-left: 20px;
            padding-right: 20px;
            background: var(--surface);
        }

        .modal-header h3,
        .sheet-header h3 {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .sheet-sub {
            font-size: 13px;
            color: var(--ink-3);
            margin-top: 2px;
            font-variant-numeric: tabular-nums;
        }

        #modal-note-edit {
            width: 100%;
            min-height: 160px;
            border: none;
            outline: none;
            resize: none;
            background: transparent;
            font-family: var(--font-note);
            font-size: 18px;
            line-height: 1.5;
            color: var(--ink);
            caret-color: var(--accent);
            padding: 4px 0 8px;
        }

        [data-skin="native"] #modal-note-edit {
            background: var(--surface-2);
            border-radius: var(--r-ctrl);
            padding: 12px 14px;
            font-size: 17px;
            line-height: 1.42;
        }

        .inline-tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            padding: 12px 0 4px;
        }

        .inline-tags-container:empty {
            display: none;
        }

        .inline-tag {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            background: var(--accent-soft);
            transition: transform 0.15s;
        }

        .inline-tag:active {
            transform: scale(0.95);
        }

        .inline-tag.tag-wiggle {
            animation: wiggle 0.3s ease-in-out infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-1.5deg); }
            50% { transform: rotate(1.5deg); }
        }

        .tag-delete-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--danger);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            z-index: 10;
            box-shadow: 0 0 0 2px var(--surface);
        }

        .section {
            padding-top: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink-2);
            margin-bottom: 10px;
        }

        /* Category picker */
        .para-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .para-option {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 48px;
            padding: 10px 12px;
            border-radius: var(--r-ctrl);
            background: var(--surface-2);
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.12s;
        }

        .para-option:active {
            transform: scale(0.97);
        }

        .para-option.selected {
            border-color: var(--cat, var(--accent));
            background: color-mix(in srgb, var(--cat, var(--accent)) 14%, var(--surface));
        }

        .para-option-title {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.25;
            color: var(--ink);
        }

        .cat-swatch {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--cat, var(--ink-3));
            flex: none;
        }

        .selected-category-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--r-ctrl);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: color-mix(in srgb, var(--cat, var(--accent)) 70%, var(--ink));
            background: color-mix(in srgb, var(--cat, var(--accent)) 16%, var(--surface));
            border: 1.5px solid color-mix(in srgb, var(--cat, var(--accent)) 50%, transparent);
        }

        .selected-category-badge .badge-x {
            font-size: 18px;
            line-height: 1;
            opacity: 0.6;
        }

        /* Tag suggestions */
        .tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag-suggestion {
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 14px;
            color: var(--ink);
            background: var(--surface-2);
            border: 1px solid var(--line);
            transition: background 0.15s, transform 0.12s;
        }

        .tag-suggestion:active {
            transform: scale(0.96);
            background: var(--accent-soft);
        }

        .tag-suggestion.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
        }

        .tag-suggestion.ai-suggested {
            border-color: color-mix(in srgb, var(--accent) 40%, transparent);
            color: var(--accent);
        }

        .tag-suggestion.ai-suggested::before {
            content: "✦ ";
            font-size: 11px;
        }

        .muted-note {
            color: var(--ink-3);
            font-size: 14px;
            padding: 4px 0;
        }

        .add-tag-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 10px;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 500;
            color: var(--accent);
            border: 1px dashed color-mix(in srgb, var(--accent) 50%, transparent);
        }

        .custom-tag-input-container {
            display: none;
            margin-top: 14px;
        }

        .custom-tag-input-container.active {
            display: flex;
            gap: 8px;
        }

        .custom-tag-input {
            flex: 1;
            min-width: 0;
            height: 42px;
            padding: 0 14px;
            border-radius: var(--r-ctrl);
            border: 1px solid var(--line);
            background: var(--surface-2);
            font-size: 16px;
            outline: none;
        }

        .custom-tag-input:focus {
            border-color: var(--accent);
        }

        .custom-tag-add-btn {
            height: 42px;
            padding: 0 18px;
            border-radius: var(--r-ctrl);
            background: var(--accent);
            color: var(--on-accent);
            font-weight: 600;
        }

        /* Note actions */
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .primary-btn,
        .secondary-btn {
            flex: 1;
            height: 48px;
            border-radius: var(--r-ctrl);
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.12s, opacity 0.2s, background 0.2s;
        }

        .primary-btn {
            background: var(--accent);
            color: var(--on-accent);
        }

        .secondary-btn {
            background: var(--surface-2);
            color: var(--ink);
        }

        .primary-btn:active,
        .secondary-btn:active {
            transform: scale(0.97);
        }

        #archive-toggle-btn.is-archived {
            color: var(--accent);
        }

        #archive-toggle-btn.is-flash {
            opacity: 0.6;
        }

        #delete-btn {
            position: relative;
            overflow: hidden;
            background: var(--danger);
            color: #fff;
        }

        #delete-btn-text {
            position: relative;
            z-index: 1;
        }

        #delete-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            background: rgba(0, 0, 0, 0.28);
        }

        /* ============================================================
           TAG VIEW
           ============================================================ */
        #tag-view-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: var(--bg);
        }

        .tag-view-inner {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            animation: slideInRight 0.28s var(--ease-out);
        }

        .tag-view-inner .header h2 {
            flex: 1;
            font-size: 20px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes slideInRight {
            from { transform: translateX(24px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           RADIAL SORT MENU
           ============================================================ */
        .swipe-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--scrim);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
            z-index: 1999;
            pointer-events: none;
        }

        .swipe-overlay.active {
            display: block;
            animation: fadeIn 0.18s ease-out;
        }

        #radial-menu {
            position: fixed;
            inset: 0;
            z-index: 2001;
            pointer-events: none;
        }

        .radial-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: var(--surface);
            border: 1.5px dashed var(--ink-3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2002;
            animation: radialCenterPop 0.26s var(--ease-spring);
        }

        @keyframes radialCenterPop {
            from { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .radial-arrow {
            display: none;
        }

        .radial-cancel-text {
            font-size: 11px;
            line-height: 1.25;
            color: var(--ink-2);
            text-align: center;
            padding: 0 12px;
        }

        .radial-category {
            position: fixed;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: var(--surface);
            border: 2px solid color-mix(in srgb, var(--cat, var(--accent)) 55%, transparent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            box-shadow: var(--shadow-pop);
            opacity: 0;
            transition: transform 0.18s var(--ease-spring), background 0.15s, border-color 0.15s;
            animation: radialCategoryAppear 0.26s var(--ease-spring) forwards;
        }

        @keyframes radialCategoryAppear {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .radial-category.highlight {
            transform: translate(-50%, -50%) scale(1.2) !important;
            background: var(--cat, var(--accent));
            border-color: var(--cat, var(--accent));
        }

        .radial-category-emoji {
            font-size: 28px;
            line-height: 1;
        }

        .radial-category-name {
            max-width: 72px;
            font-size: 11px;
            font-weight: 600;
            color: var(--ink);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .radial-category.highlight .radial-category-name {
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* ============================================================
           CATEGORY MANAGER
           ============================================================ */
        .cat-row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line);
        }

        .cat-move {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: none;
        }

        .cat-move button {
            width: 30px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            background: var(--accent-soft);
        }

        .cat-move button:disabled {
            color: var(--ink-3);
            background: transparent;
            cursor: default;
        }

        .cat-move svg.icon {
            width: 14px;
            height: 14px;
            stroke-width: 2.6;
        }

        .cat-emoji {
            width: 44px;
            height: 44px;
            flex: none;
            border-radius: var(--r-ctrl);
            border: 1px solid var(--line);
            background: var(--surface-2);
            text-align: center;
            font-size: 22px;
            outline: none;
        }

        .cat-name {
            flex: 1;
            min-width: 0;
            height: 44px;
            padding: 0 12px;
            border-radius: var(--r-ctrl);
            border: 1px solid var(--line);
            background: var(--surface-2);
            font-size: 16px;
            outline: none;
        }

        .cat-emoji:focus,
        .cat-name:focus {
            border-color: var(--accent);
        }

        .cat-color {
            width: 34px;
            height: 34px;
            flex: none;
            border-radius: 50%;
            border: none;
            padding: 0;
            background: none;
            overflow: hidden;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--line);
        }

        .cat-color::-webkit-color-swatch-wrapper { padding: 0; }
        .cat-color::-webkit-color-swatch { border: none; border-radius: 50%; }
        .cat-color::-moz-color-swatch { border: none; border-radius: 50%; }

        .cat-delete {
            width: 36px;
            height: 36px;
            flex: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--danger);
        }

        .cat-delete:disabled {
            color: var(--ink-3);
            cursor: default;
        }

        .cat-delete svg.icon {
            width: 20px;
            height: 20px;
        }

        .btn-block {
            display: block;
            width: 100%;
            height: 48px;
            margin-top: 16px;
            border-radius: var(--r-ctrl);
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
        }

        .sheet-hint {
            text-align: center;
            color: var(--ink-3);
            font-size: 13px;
            margin-top: 14px;
        }

        /* ============================================================
           WIDGETS
           ============================================================ */
        .widgets {
            display: grid;
            gap: 12px;
            padding: 4px 0;
        }

        .widget-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px;
            border-radius: var(--r-card);
            background: var(--surface);
            box-shadow: var(--shadow-card);
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: transform 0.15s var(--ease-out), background 0.15s;
        }

        .widget-card:active {
            transform: scale(0.98);
            background: var(--surface-2);
        }

        .widget-icon {
            width: 52px;
            height: 52px;
            flex: none;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: var(--accent-soft);
        }

        .widget-body {
            flex: 1;
            min-width: 0;
        }

        .widget-title {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--ink);
        }

        .widget-desc {
            font-size: 14px;
            color: var(--ink-2);
            margin-top: 2px;
            line-height: 1.35;
        }

        .widget-chev {
            color: var(--ink-3);
            flex: none;
        }

        .widget-chev svg.icon {
            width: 18px;
            height: 18px;
        }

        /* Word cloud */
        #word-cloud-container {
            padding: 12px 0 8px;
            text-align: center;
            line-height: 1.7;
        }

        .word-cloud-word {
            display: inline-block;
            margin: 2px 6px;
            padding: 2px 6px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--ink-2);
            font-family: var(--font-note);
            transition: background 0.15s, color 0.15s;
            vertical-align: middle;
        }

        .word-cloud-word.top {
            color: var(--accent);
            font-weight: 600;
        }

        .word-cloud-word:active {
            background: var(--accent);
            color: var(--on-accent);
        }

        .word-count {
            font-family: var(--font-ui);
            font-size: 10px;
            color: var(--ink-3);
            margin-left: 2px;
            vertical-align: super;
        }
    </style>
</head>
<body>
    <!-- Capture Screen -->
    <div id="capture-screen">
        <div class="capture-header">
            <button class="header-circle-btn" onclick="viewArchive()" aria-label="Your notes">
                <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
                <span class="inbox-dot" id="capture-inbox-count"></span>
            </button>
            <div class="capture-title">Somio</div>
            <div class="header-spacer" aria-hidden="true"></div>
        </div>
        <div class="capture-date" id="capture-date"></div>
        <textarea
            id="note-input"
            placeholder="Write it down…"
            autofocus
        ></textarea>
        <div class="save-bar">
            <button class="save-note-btn" id="save-note-btn" disabled
                onmousedown="event.preventDefault()"
                onclick="saveAndClear()">
                <svg class="icon icon-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <svg class="icon icon-check" viewBox="0 0 24 24"><polyline points="5 12.5 10 17.5 19 7.5"/></svg>
                <span id="save-note-label">Save note</span>
            </button>
        </div>
    </div>

    <!-- Notes List Screen -->
    <div id="archive-screen">
        <div class="header">
            <h2>Somio</h2>
            <div class="search-bar">
                <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
                <input type="search" id="search-input" placeholder="Search" oninput="filterNotes()" autocomplete="off" enterkeyhint="search">
                <button class="search-clear-btn" id="search-clear-btn" onclick="clearSearch()" aria-label="Clear search">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
                </button>
            </div>
            <div class="menu-anchor">
                <button class="close-btn" onclick="toggleExportMenu()" id="export-menu-btn" aria-label="More options">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="19" cy="12" r="1.2" fill="currentColor"/></svg>
                </button>
                <div id="export-menu" style="display: none;">
                    <button class="menu-item" onclick="openCategoryManager()">
                        Manage categories
                        <svg class="icon" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
                    </button>
                    <button class="menu-item" onclick="copyToClipboard()">
                        Copy all notes
                        <svg class="icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
                    </button>
                    <button class="menu-item" onclick="downloadCSV()">
                        Back up notes
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 4v11"/><polyline points="7 10 12 15 17 10"/><line x1="5" y1="20" x2="19" y2="20"/></svg>
                    </button>
                    <button class="menu-item" onclick="document.getElementById('import-file').click()">
                        Restore from backup
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 20V9"/><polyline points="7 14 12 9 17 14"/><line x1="5" y1="4" x2="19" y2="4"/></svg>
                    </button>
                </div>
                <input type="file" id="import-file" accept=".csv" style="display: none;" onchange="importNotes(event)">
            </div>
        </div>
        <div class="filter-tabs">
            <!-- Tabs dynamically populated -->
        </div>
        <div class="notes-list" id="notes-list"></div>

        <button class="fab" onclick="newNoteFromArchive()" aria-label="New note">
            <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
    </div>

    <!-- Tag View Screen -->
    <div id="tag-view-screen">
        <div class="tag-view-inner">
            <div class="header">
                <button class="close-btn" onclick="backFromTagView()" aria-label="Back">
                    <svg class="icon" viewBox="0 0 24 24"><polyline points="15 5 8 12 15 19"/></svg>
                </button>
                <h2 id="tag-view-title">Tag</h2>
            </div>
            <div class="notes-list" id="tag-notes-list"></div>

            <button class="fab" onclick="newNoteFromArchive()" aria-label="New note">
                <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </div>
    </div>

    <!-- Edit Note Sheet -->
    <div id="edit-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="sheet-grabber"></div>
            <div class="modal-header">
                <div>
                    <h3>Note</h3>
                    <div class="sheet-sub" id="note-timestamp"></div>
                </div>
                <button class="text-btn" onclick="closeModalWithSave()">Done</button>
            </div>

            <textarea id="modal-note-edit" placeholder="Write it down…"></textarea>

            <div class="inline-tags-container" id="inline-tags"></div>

            <div class="section">
                <div class="section-title">Category</div>

                <div id="selected-category-display" style="display: none;">
                    <div class="selected-category-badge" onclick="deselectCategory()">
                        <span id="selected-category-text"></span>
                        <span class="badge-x" aria-label="Remove category">×</span>
                    </div>
                </div>

                <div class="para-options" id="category-options">
                    <!-- Categories dynamically populated -->
                </div>
            </div>

            <div class="section">
                <div class="section-title">Tags</div>
                <div class="tag-suggestions" id="quick-tag-suggestions"></div>
                <button class="add-tag-btn" onclick="showTagPicker()">+ Add tag</button>
            </div>

            <div class="modal-actions">
                <button class="secondary-btn" onclick="toggleArchiveNote()" id="archive-toggle-btn">Archive</button>
                <button class="secondary-btn" id="delete-btn" style="display: none;"
                    ontouchstart="startDeleteHold(event)"
                    ontouchend="cancelDeleteHold()"
                    ontouchcancel="cancelDeleteHold()"
                    onmousedown="startDeleteHold(event)"
                    onmouseup="cancelDeleteHold()"
                    onmouseleave="cancelDeleteHold()">
                    <span id="delete-btn-text">Hold to delete</span>
                    <div id="delete-progress"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Radial Sort Menu -->
    <div class="swipe-overlay" id="swipe-overlay"></div>
    <div id="radial-menu" style="display: none;">
        <div class="radial-center" id="radial-center">
            <div class="radial-arrow" id="radial-arrow"></div>
            <div class="radial-cancel-text">Let go here to cancel</div>
        </div>
        <div id="radial-categories"></div>
    </div>

    <!-- Tag Picker Sheet -->
    <div id="tag-picker-modal" class="sheet-backdrop" style="display: none;" onclick="closeTagPicker(event)">
        <div class="sheet" onclick="event.stopPropagation()">
            <div class="sheet-grabber"></div>
            <div class="sheet-header">
                <h3>Add tags</h3>
                <button class="text-btn" onclick="closeTagPicker()">Done</button>
            </div>

            <div class="tag-suggestions" id="tag-picker-suggestions"></div>

            <div class="custom-tag-input-container active">
                <input type="text" id="tag-picker-input" class="custom-tag-input" placeholder="New tag" autocapitalize="none" enterkeyhint="done">
                <button class="custom-tag-add-btn" onclick="addTagFromPicker()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('quickNotes') || '[]');
        
        // Category management
        const DEFAULT_CATEGORIES = [

        // Smart default tab selection

            // Check if inbox has notes
            const inboxCount = notes.filter(n => (!n.para || n.para === null) && !n.archived).length;
            if (inboxCount > 0) {
                return 'unsorted'; // inbox
            }
            
            // Find first category with notes (in order)
            for (const cat of customCategories) {
                const catCount = notes.filter(n => n.para === cat.id && !n.archived).length;
                if (catCount > 0) {
                    return cat.id;
                }
            }
            
            // No notes anywhere - default to first category
            return customCategories[0]?.id || 'unsorted';

        function formatWhen(iso) {
            const d = new Date(iso);
            if (isNaN(d)) return '';
            const now = new Date();
            const secs = (now - d) / 1000;
            if (secs < 60) return 'Just now';
            if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
            if (d.toDateString() === now.toDateString()) {
                return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
            }
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
            if (secs < 6 * 86400) return d.toLocaleDateString([], { weekday: 'long' });
            if (d.getFullYear() === now.getFullYear()) {
                return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
            return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function showToast(message, duration = 2000) {
            // Remove any existing toast
            const existingToast = document.getElementById('toast');
            if (existingToast) existingToast.remove();
            
            // Create new toast
            const toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            // Show toast
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Hide and remove toast

        function generateCSV() {
            const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
            let csv = 'ID,Text,Created,Tags,Category,Archived,CategoryName,CategoryEmoji,CategoryColor\n';

            notes.forEach(note => {
                const cat = getCategory(note.para);
                csv += [
                    note.id,
                    note.text || '',
                    note.created,
                    (note.tags || []).join(';'),
                    note.para || '',
                    note.archived ? 'true' : 'false',
                    cat ? cat.name : '',
                    cat ? cat.emoji : '',
                    cat ? cat.color : ''
                ].map(q).join(',') + '\n';
            });
            
            return csv;
        }

        function downloadCSV() {
            toggleExportMenu();
            
            const csv = generateCSV();
            const filename = `somio-backup-${new Date().toISOString().split('T')[0]}.csv`;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

            // On iPhone, the share sheet is the reliable way to save a file (choose Save to Files)
            try {
                const file = new File([blob], filename, { type: 'text/csv' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    navigator.share({ files: [file], title: 'Somio backup' }).catch(() => {});
                    return;
                }
            } catch (e) {}

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function copyToClipboard() {
            toggleExportMenu();
            
            const readableText = generateReadableText();
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(readableText).then(() => {
                    showToast(`✓ Copied ${notes.length} notes to clipboard!`);
                }).catch((error) => {
                    showToast('Failed to copy to clipboard');
                });
            } else {
                showToast('Clipboard not available');
            }
        }

        function generateReadableText() {
            let text = `SOMIO NOTES BACKUP\n`;
            text += `Exported: ${new Date().toLocaleString()}\n`;
            text += `Total Notes: ${notes.length}\n`;
            text += `\n${'='.repeat(60)}\n\n`;
            
            // Group notes by category
            const grouped = {
                'Inbox': notes.filter(n => (!n.para || n.para === null) && !n.archived),
                'Archived': notes.filter(n => n.archived)
            };
            
            // Add categorized notes
            customCategories.forEach(cat => {
                grouped[`${cat.emoji} ${cat.name}`] = notes.filter(n => n.para === cat.id && !n.archived);
            });
            
            // Output each group
            Object.entries(grouped).forEach(([categoryName, categoryNotes]) => {
                if (categoryNotes.length === 0) return;
                
                text += `\n[ ${categoryName.toUpperCase()} ]\n`;
                text += `${'-'.repeat(60)}\n\n`;
                
                categoryNotes.forEach((note, index) => {
                    const date = new Date(note.created);
                    const dateStr = date.toLocaleDateString();
                    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    text += `${index + 1}. ${note.text}\n`;
                    text += `   Date: ${dateStr} ${timeStr}\n`;
                    
                    if (note.tags && note.tags.length > 0) {
                        text += `   Tags: ${note.tags.join(', ')}\n`;
                    }
                    
                    text += `\n`;
                });
            });
            
            text += `\n${'='.repeat(60)}\n`;
            text += `End of backup\n`;
            
            return text;
        }

        // Proper CSV reader: handles commas, quotes and line breaks inside quoted fields
        function parseCSV(text) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            text = text.replace(/^\uFEFF/, '');
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (text[i + 1] === '"') { field += '"'; i++; }
                        else inQuotes = false;
                    } else {
                        field += ch;
                    }
                } else if (ch === '"') {
                    inQuotes = true;
                } else if (ch === ',') {
                    row.push(field); field = '';
                } else if (ch === '\n' || ch === '\r') {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(field); rows.push(row); row = []; field = '';
                } else {
                    field += ch;
                }
            }
            if (field !== '' || row.length) { row.push(field); rows.push(row); }
            return rows.filter(r => r.some(cell => cell.trim() !== ''));
        }

        function importNotes(event) {
            document.getElementById('export-menu').style.display = 'none';
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const rows = parseCSV(e.target.result);
                    if (rows.length < 2) {
                        showToast('No notes found in that file');
                        return;
                    }

                    // Find columns by header name so older exports still work
                    const header = rows[0].map(h => h.trim().toLowerCase());
                    const col = (name) => header.indexOf(name);
                    const iId = col('id'), iText = col('text'), iCreated = col('created'),
                          iTags = col('tags'), iCat = col('category'), iArch = col('archived'),
                          iCatName = col('categoryname'), iCatEmoji = col('categoryemoji'), iCatColor = col('categorycolor');
                    if (iText === -1) {
                        showToast('That file isn\'t a Somio backup');
                        return;
                    }

                    // Bring back the categories the backup used (names, emoji, colours)
                    let categoriesChanged = false;
                    if (iCat > -1 && iCatName > -1) {
                        rows.slice(1).forEach(r => {
                            const id = (r[iCat] || '').trim();
                            const name = (r[iCatName] || '').trim();
                            if (!id || !name) return;
                            const fromFile = {
                                id,
                                name,
                                emoji: (r[iCatEmoji] || '').trim() || '📝',
                                color: (r[iCatColor] || '').trim() || '#8E8E93'
                            };
                            const existing = customCategories.find(c => c.id === id);
                            if (existing) {
                                if (existing.name !== fromFile.name || existing.emoji !== fromFile.emoji || existing.color !== fromFile.color) {
                                    Object.assign(existing, fromFile);
                                    categoriesChanged = true;
                                }
                            } else if (customCategories.length < MAX_CATEGORIES) {
                                customCategories.push(fromFile);
                                categoriesChanged = true;
                            }
                        });
                        if (categoriesChanged) saveCategories();
                    }

                    const existingIds = new Set(notes.map(n => n.id));
                    const imported = [];
                    let skipped = 0;

                    rows.slice(1).forEach((r, i) => {
                        const text = (r[iText] || '').trim();
                        if (!text) return;
                        const id = iId > -1 ? (parseInt(r[iId]) || Date.now() + i) : Date.now() + i;
                        if (existingIds.has(id)) { skipped++; return; }
                        existingIds.add(id);
                        imported.push({
                            id,
                            text,
                            created: (iCreated > -1 && r[iCreated]) ? r[iCreated].trim() : new Date().toISOString(),
                            tags: iTags > -1 ? r[iTags].split(';').map(t => t.trim()).filter(Boolean) : [],
                            para: (iCat > -1 && getCategory(r[iCat].trim())) ? r[iCat].trim() : null,
                            archived: iArch > -1 && r[iArch].trim() === 'true'
                        });
                    });

                    if (imported.length > 0) {
                        notes = [...imported, ...notes].sort((a, b) => new Date(b.created) - new Date(a.created));
                        localStorage.setItem('quickNotes', JSON.stringify(notes));
                        currentFilter = getDefaultFilter();
                        updateTabCounts();
                        renderNotes();
                        showToast(`Imported ${imported.length} ${imported.length === 1 ? 'note' : 'notes'}`);
                    } else if (skipped > 0) {
                        showToast('Those notes are already here');
                    } else {
                        showToast('No notes found in that file');
                    }
                } catch (error) {
                    showToast('Couldn\'t read that file');
                    console.error('Import error:', error);
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function renderCategoryManager() {
            const container = document.getElementById('category-list');
            const last = customCategories.length - 1;
            const canDelete = customCategories.length > MIN_CATEGORIES;
            const up = '<svg class="icon" viewBox="0 0 24 24"><polyline points="6 15 12 9 18 15"/></svg>';
            const down = '<svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';
            const trash = '<svg class="icon" viewBox="0 0 24 24"><polyline points="4 7 20 7"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></svg>';
            let html = '';

            customCategories.forEach((cat, index) => {
                html += `
                    <div class="cat-row">
                        <div class="cat-move">
                            <button onclick="moveCategoryUp(${index})" ${index === 0 ? 'disabled' : ''} aria-label="Move up">${up}</button>
                            <button onclick="moveCategoryDown(${index})" ${index === last ? 'disabled' : ''} aria-label="Move down">${down}</button>
                        </div>
                        <input type="text" class="cat-emoji" value="${escapeHtml(cat.emoji)}" maxlength="2"
                            onchange="updateCategoryField(${index}, 'emoji', this.value)" aria-label="Emoji">
                        <input type="text" class="cat-name" value="${escapeHtml(cat.name)}" placeholder="Category name"
                            onchange="updateCategoryField(${index}, 'name', this.value)" aria-label="Name">
                        <input type="color" class="cat-color" value="${cat.color}"
                            onchange="updateCategoryField(${index}, 'color', this.value)" aria-label="Color">
                        <button class="cat-delete" onclick="deleteCategory(${index})" ${canDelete ? '' : 'disabled'} aria-label="Delete category">${trash}</button>
                    </div>
                `;
            });

            if (customCategories.length < MAX_CATEGORIES) {
                html += `<button class="btn-block" onclick="addCategory()">Add category</button>`;
            }

            html += `<p class="sheet-hint">${customCategories.length} of ${MAX_CATEGORIES} categories. Use the arrows to set tab order.</p>`;

            container.innerHTML = html;
        }

        function moveCategoryUp(index) {
            if (index === 0) return;
            
            // Swap with previous
            const temp = customCategories[index];
            customCategories[index] = customCategories[index - 1];
            customCategories[index - 1] = temp;
            
            saveCategories();
            renderCategoryManager();
            rebuildFilterTabs();
        }

        function moveCategoryDown(index) {
            if (index === customCategories.length - 1) return;
            
            // Swap with next
            const temp = customCategories[index];
            customCategories[index] = customCategories[index + 1];
            customCategories[index + 1] = temp;
            
            saveCategories();
            renderCategoryManager();
            rebuildFilterTabs();
        }

        function addCategory() {
            if (customCategories.length >= MAX_CATEGORIES) {
                showToast(`Maximum ${MAX_CATEGORIES} categories`);
                return;
            }
            
            customCategories.push({
                id: 'category_' + Date.now(),
                name: 'New Category',
                emoji: '📝',
                color: '#999999'
            });
            
            saveCategories();
            renderCategoryManager();
            rebuildFilterTabs();
        }

        function updateCategoryField(index, field, value) {
            if (field === 'name' && !value.trim()) {
                showToast('Category name cannot be empty');
                renderCategoryManager();
                return;
            }
            
            const oldId = customCategories[index].id;
            customCategories[index][field] = value;
            
            saveCategories();
            rebuildFilterTabs();
            renderCategoryManager();
        }

        function deleteCategory(index) {
            if (customCategories.length <= MIN_CATEGORIES) {
                showToast(`Minimum ${MIN_CATEGORIES} category required`);
                return;
            }
            
            const cat = customCategories[index];
            const affectedNotes = notes.filter(n => n.para === cat.id);
            
            if (affectedNotes.length > 0) {
                const confirmed = confirm(`${affectedNotes.length} note(s) use this category. They will be moved to Inbox. Continue?`);
                if (!confirmed) return;
                
                // Move notes to unsorted
                affectedNotes.forEach(note => {
                    note.para = null;
                });
                localStorage.setItem('quickNotes', JSON.stringify(notes));
            }
            
            customCategories.splice(index, 1);
            saveCategories();
            renderCategoryManager();
            rebuildFilterTabs();
            updateTabCounts();
            renderNotes();
        }

        function saveCategories() {
            localStorage.setItem('customCategories', JSON.stringify(customCategories));
        }

        function rebuildFilterTabs() {
            // Rebuild the filter tabs HTML based on current categories
            const tabsContainer = document.querySelector('.filter-tabs');
            if (!tabsContainer) return;
            
            // Check if inbox has any notes
            const inboxCount = notes.filter(n => (!n.para || n.para === null) && !n.archived).length;
            
            let html = '';
            
            // Only show Inbox tab if it has notes
            if (inboxCount > 0) {
                html += `
                    <button class="filter-tab ${currentFilter === 'unsorted' ? 'active' : ''}" 
                            onclick="setFilter('unsorted')">
                        📥 Inbox <span class="tab-count">${inboxCount}</span>
                    </button>
                `;
            }
            
            customCategories.forEach(cat => {
                const catCount = notes.filter(n => n.para === cat.id && !n.archived).length;
                html += `
                    <button class="filter-tab ${currentFilter === cat.id ? 'active' : ''}" 
                            onclick="setFilter('${cat.id}')">
                        ${cat.emoji} ${cat.name}${catCount > 0 ? ` <span class="tab-count">${catCount}</span>` : ''}
                    </button>
                `;
            });
            
            const archivedCount = notes.filter(n => n.archived).length;
            
            html += `
                <button class="filter-tab ${currentFilter === 'widgets' ? 'active' : ''}" 
                        onclick="setFilter('widgets')">
                    🔧 Widgets
                </button>
                <button class="filter-tab ${currentFilter === 'archived' ? 'active' : ''}" 
                        onclick="setFilter('archived')">
                    📦 Archived${archivedCount > 0 ? ` <span class="tab-count">${archivedCount}</span>` : ''}
                </button>
            `;
            
            tabsContainer.innerHTML = html;
            updateCaptureMeta();
        }

        function toggleLockFilter(filter, element) {
            if (lockedFilter === filter) {
                // Unlock
                lockedFilter = null;
                localStorage.removeItem('lockedFilter');
                element.classList.remove('locked');
            } else {
                // Lock this filter
                lockedFilter = filter;
                localStorage.setItem('lockedFilter', filter);
                
                // Remove lock from all tabs
                document.querySelectorAll('.filter-tab').forEach(tab => {
                    tab.classList.remove('locked');
                });
                element.classList.add('locked');
            }
        }

        function startTabLongPress(e, filter) {
            clearTabLongPress();
            tabLongPressTimer = setTimeout(() => {
                navigator.vibrate && navigator.vibrate(50);
                toggleLockFilter(filter, e.target);
            }, 700);
        }

        function clearTabLongPress() {
            if (tabLongPressTimer) {
                clearTimeout(tabLongPressTimer);

            }

        function filterNotes() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('search-clear-btn');
            const filterTabs = document.querySelector('.filter-tabs');
            
            // Show/hide clear button and tabs based on search
            if (searchInput.value.trim()) {
                clearBtn.style.display = 'flex';
                // Hide tabs when searching with animation
                filterTabs.classList.add('hidden');
            } else {
                clearBtn.style.display = 'none';
                // Show tabs when not searching
                filterTabs.classList.remove('hidden');
            }
            
            renderNotes();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-clear-btn').style.display = 'none';
            // Show tabs again when search is cleared
            document.querySelector('.filter-tabs').classList.remove('hidden');
            renderNotes();

        function getCategoryDisplay(paraId) {
            if (!paraId) return '';
            const category = customCategories.find(c => c.id === paraId);
            if (!category) return '';
            return `${category.emoji} ${category.name}`;
        }

        function renderNoteCard(note, opts = {}) {
            const actualIndex = notes.findIndex(n => n.id === note.id);
            const showCat = note.para && getCategory(note.para) && (opts.searching || note.para !== currentFilter);
            const actionButton = note.archived
                ? `<div class="swipe-action delete-action" onclick="permanentDeleteNote(${actualIndex})">Delete</div>`
                : `<div class="swipe-action archive-action" onclick="quickArchiveNote(${actualIndex})">Archive</div>`;
            const tags = (note.tags || []).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('');

            return `
                <div class="swipeable-note-container ${opts.suggested ? 'is-suggested' : ''}" data-note-index="${actualIndex}">
                    ${actionButton}
                    <div class="note-card"
                         style="${catStyle(note.para)}"
                         data-note-index="${actualIndex}"
                         onmousedown="handleNoteClick(event, ${actualIndex})">
                        <div class="note-preview">${escapeHtml(note.text)}</div>
                        <div class="note-meta">
                            <div class="note-tags">${note.archived && opts.searching ? '<span class="para-badge archived-badge">Archived</span>' : ''}${showCat ? `<span class="para-badge" style="${catStyle(note.para)}">${escapeHtml(getCategoryDisplay(note.para))}</span>` : ''}${tags}</div>
                            <span class="note-when">${formatWhen(note.created)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderNotes() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase().trim();
            const container = document.getElementById('notes-list');

            if (currentFilter === 'widgets' && !searchTerm) {
                renderWidgetsView();
                return;
            }

            let exactMatches = [];
            let suggestedMatches = [];

            notes.forEach(note => {
                if (note.archived && currentFilter !== 'archived') return;

                let matchesFilter;
                if (currentFilter === 'archived') {
                    matchesFilter = note.archived === true;
                } else if (currentFilter === 'unsorted') {
                    matchesFilter = !note.para && !note.archived;
                } else {
                    matchesFilter = note.para === currentFilter && !note.archived;
                }

                if (searchTerm) {
                    const exactMatch = note.text.toLowerCase().includes(searchTerm) ||
                        (note.tags && note.tags.some(tag => tag.toLowerCase().includes(searchTerm)));

                    if (exactMatch && !note.archived) {
                        exactMatches.push(note);
                    } else if (!note.archived) {
                        const aiSuggestions = generateTagSuggestions(note.text);
                        if (aiSuggestions.some(tag => tag.toLowerCase().includes(searchTerm))) {
                            suggestedMatches.push(note);
                        }
                    }
                } else if (matchesFilter) {
                    exactMatches.push(note);
                }
            });

            if (exactMatches.length + suggestedMatches.length === 0) {
                let message = 'Nothing here yet. Tap + to write a note.';
                if (searchTerm) message = `No notes mention “${escapeHtml(searchTerm)}”.`;
                else if (currentFilter === 'archived') message = 'Archived notes will collect here.';
                container.innerHTML = `<div class="empty-state">${message}</div>`;
                return;
            }

            let html = exactMatches.map(note => renderNoteCard(note, { searching: !!searchTerm })).join('');

            if (searchTerm && suggestedMatches.length > 0) {
                html += `<div class="list-label">Related notes</div>`;
                html += suggestedMatches.map(note => renderNoteCard(note, { searching: true, suggested: true })).join('');
            }

            container.innerHTML = html;
            setupNoteTouchListeners();
        }

        function openRandomNote() {

            if (availableNotes.length === 0) {

        function openWordCloud() {
            document.getElementById('word-cloud-modal').style.display = 'block';
